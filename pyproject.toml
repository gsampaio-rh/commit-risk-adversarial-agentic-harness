[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cr-analyzer"
version = "0.1.0"
description = "9-stage pipeline that pre-analyzes ITSM change requests for CAB meetings"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]
ml = [
    "sentence-transformers>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cr_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
