[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-investigator"
version = "0.1.0"
description = "Investigative agent for commit risk assessment with structured evidence and explanations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx",
    "xgboost",
    "scikit-learn",
    "cursor-sdk>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commit_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
